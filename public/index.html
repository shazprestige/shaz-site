<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHAZ</title>
<link rel="stylesheet" href="/styles.css?v=122">
</head>
<body>
<div class="announce" id="announceWrap"><div class="track" id="campaign"></div></div>

<header id="stickyHeader">
  <div class="headrow">
    <button class="menuBtn" id="categoryMenuBtn" aria-label="Kategoriler"><span></span><span></span><span></span></button>
    <img class="logo" id="brandLogo" alt="SHAZ">
    <div class="headActions">
      <a class="headerAction cargoAction" id="cargoLink" href="https://ebranch.araskargo.com.tr/" target="_blank" rel="noopener">
        <span class="headerIconWrap"><span class="packageIcon" aria-hidden="true"></span></span>
        <span class="headerActionText cargoText"><span>Kargom</span><span>Nerede?</span></span>
      </a>
      <button class="headerAction" id="favLink" aria-label="Favorilerim">
        <span class="headerIconWrap"><span class="headerCountBadge" id="favBadge">0</span><span class="headerActionIcon">♡</span></span>
        <span class="headerActionText">Favorilerim</span>
      </button>
      <button class="headerAction cartAction" id="cartBtn" aria-label="Sepetim">
        <span class="headerIconWrap"><span class="headerCountBadge" id="cartBadge">0</span><span class="headerActionIcon bagIcon"></span></span>
        <span class="headerActionText">Sepetim</span>
      </button>
    </div>
  </div>
  <div class="tabs" id="catalogNav"></div>
</header>

<div id="campaignCards" class="campaignCards"></div>

<div class="categoryHub hidden" id="categoryHub">
  <div class="categoryHubTop"><button class="categoryBack" id="categoryHubClose">←</button><div><b>Kategoriler</b><small>Tüm kategoriler</small></div></div>
  <div class="categoryHubGrid" id="categoryHubGrid"></div>
</div>

<section class="hero">
  <h1 id="heroTitle"></h1>
  <div class="rule"></div>
  <p id="heroSubtitle"></p>
  <div class="builderCard" id="builderSpotlight">
    <div class="builderSpotlightCopy"><span class="gold" id="builderSpotlightEyebrow">KENDİ SETİNİ OLUŞTUR</span><h3 id="builderSpotlightTitle">Setini sen seç.</h3><p id="builderSpotlightText">Ürünlerini bir araya getir, özel set fiyatını anında gör.</p></div>
    <button class="arrow" id="builderSpotlightBtn">→</button>
  </div>
</section>

<section class="section" id="products">
  <div class="sectionHead"><h2 id="catalogTitle">Tüm Ürünler</h2></div>
  <div class="tools sortTools"><label class="sortLabel" for="sortProducts">Sırala</label><select class="tool sortSelect" id="sortProducts" aria-label="Ürünleri sırala"><option value="priceAsc">Fiyat: Düşükten yükseğe</option><option value="priceDesc">Fiyat: Yüksekten düşüğe</option></select></div>
  <input id="search" class="search" placeholder="Ürün ara" style="display:none">
  <div class="grid products" id="productsList"></div>
</section>

<div class="floating">
  <a class="contact green" id="wa"><span class="contactIcon brandIcon waIcon" aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M12 2a9.5 9.5 0 0 0-8.21 14.27L2.5 21.5l5.38-1.25A9.5 9.5 0 1 0 12 2Zm0 17.2a7.7 7.7 0 0 1-3.92-1.07l-.28-.17-3.19.74.77-3.1-.18-.29A7.7 7.7 0 1 1 12 19.2Zm4.23-5.76c-.23-.12-1.37-.68-1.58-.76-.21-.08-.36-.12-.52.12-.15.23-.6.76-.74.92-.14.15-.27.17-.5.06-.23-.12-.98-.36-1.86-1.15-.69-.61-1.15-1.36-1.29-1.59-.13-.23-.01-.35.1-.46.1-.1.23-.27.35-.4.12-.14.15-.23.23-.39.08-.15.04-.29-.02-.4-.06-.12-.52-1.25-.71-1.71-.19-.45-.38-.39-.52-.4h-.44c-.15 0-.4.06-.61.29-.21.23-.8.78-.8 1.9 0 1.11.82 2.19.93 2.34.12.15 1.6 2.44 3.88 3.42.54.23.96.37 1.29.48.54.17 1.04.15 1.43.09.44-.07 1.37-.56 1.56-1.1.19-.54.19-1 .13-1.1-.06-.1-.21-.15-.44-.27Z"/></svg></span><span><b>Aklınıza takılan bir şey mi var?</b><small>Buraya tıkla ve iletişime geç</small></span></a>
  <a class="contact ig" id="ig"><span class="contactIcon brandIcon igIcon" aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2" ry="5.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.9" r="1.2" fill="currentColor"/></svg></span><span><b>Aklınıza takılan bir şey mi var?</b><small>Buraya tıkla ve iletişime geç</small></span></a>
</div>


<div class="siteAnnouncement hidden" id="siteAnnouncement" role="dialog" aria-modal="true" aria-labelledby="siteAnnouncementTitle">
  <div class="siteAnnouncementCard">
    <button class="siteAnnouncementClose" id="siteAnnouncementClose" type="button" aria-label="Duyuruyu kapat">×</button>
    <div class="siteAnnouncementEyebrow" id="siteAnnouncementEyebrow">DUYURU</div>
    <h2 id="siteAnnouncementTitle"></h2>
    <p id="siteAnnouncementText"></p>
    <button class="siteAnnouncementButton" id="siteAnnouncementButton" type="button">Kapat</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div class="overlay hidden" id="overlay"></div>
<div class="drawer hidden" id="drawer"></div>
<script src="/app.js?v=122"></script>
</body>
</html>
