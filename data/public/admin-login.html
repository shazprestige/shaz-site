<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SHAZ Yönetim Girişi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1eb;color:#171717;min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%);background:white;border:1px solid #ddd6cc;border-radius:20px;padding:28px;box-shadow:0 16px 50px rgba(0,0,0,.08)}
.brand{text-align:center;font-size:28px;font-weight:900;letter-spacing:4px;margin-bottom:5px}.sub{text-align:center;color:#666;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cfc8bf;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:white;font-size:15px;font-weight:800;margin-top:18px;cursor:pointer}
#error{display:none;background:#fff0f0;color:#a40000;border:1px solid #ffcaca;border-radius:9px;padding:10px;margin-top:12px;font-size:13px}
.note{font-size:11px;color:#777;text-align:center;margin-top:15px}
</style>
</head>
<body>
<form class="login" id="loginForm">
  <div class="brand">SHAZ</div>
  <div class="sub">Yönetim Paneli</div>
  <label>Kullanıcı adı</label>
  <input id="username" autocomplete="username" required>
  <label>Şifre</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button type="submit">Giriş Yap</button>
  <div id="error"></div>
  <div class="note">Bu alan yalnızca yetkili yönetici içindir.</div>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const error=document.getElementById('error');
  error.style.display='none';
  const r=await fetch('/api/admin/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:document.getElementById('username').value,
      password:document.getElementById('password').value
    })
  });
  if(r.ok){location.href='/admin';return}
  let msg='Kullanıcı adı veya şifre hatalı.';
  try{const j=await r.json();if(j.message)msg=j.message}catch{}
  error.textContent=msg;error.style.display='block';
});
</script>
</body></html>
