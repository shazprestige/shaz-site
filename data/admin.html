<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SHAZ Yönetim</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="admin simpleAdmin">
  <aside class="sidebar simpleSidebar">
    <h2>SHAZ Yönetim</h2>
    <p>Karışık teknik ayarları kaldırdım. Dört ana bölümden siteyi yönetebilirsin.</p>
    <button onclick="show('site')">1. Site Ayarları</button>
    <button onclick="show('catalog')">2. Kategoriler & Ürünler</button>
    <button onclick="show('custom')">3. Setler & Kişiselleştirme</button>
    <button onclick="show('orders')">4. Siparişler</button>
    <a href="/" style="display:block;margin-top:18px;color:white">← Müşteri sitesine dön</a><button onclick="logoutAdmin()" style="margin-top:10px">Çıkış Yap</button>
  </aside>
  <main class="content"><div id="view"></div></main>
  <aside class="previewPane">
    <h3>📱 Müşteri Gözüyle Canlı Önizleme</h3>
    <div class="previewNote">Hangi ayarı düzenliyorsan telefon ekranı otomatik olarak o bölüme gider.</div>
    <div class="phoneShell"><iframe class="phoneScreen" id="previewFrame" src="/?adminpreview=1"></iframe></div>
  </aside>
</div>
<script src="/admin.js"></script>
</body></html>
